<!DOCTYPE html>
<!-- index.html: la única página de la app. El navegador la lee de arriba abajo. -->
<html lang="es">
<head>
  <!-- Codificación de caracteres: permite acentos, ñ y los palos ♠ ♥ ♦ ♣ -->
  <meta charset="utf-8">

  <!-- Ajusta la página al ancho del móvil.
       viewport-fit=cover: usa toda la pantalla, también la zona de la "muesca". -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Póker Estudio</title>

  <!-- Color de la barra superior del sistema -->
  <meta name="theme-color" content="#0f1115">

  <!-- Icono de la pestaña del navegador (favicon) -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- Metaetiquetas para la app instalada (pantalla completa).
       "apple-mobile-web-app-capable" está obsoleto, pero Safari en iPhone todavía lo necesita. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Póker Estudio">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <!-- El manifest describe la app instalable (nombre, iconos, colores) -->
  <link rel="manifest" href="manifest.json">

  <!-- Nuestra hoja de estilos -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Barra que aparece cuando se ha descargado una versión nueva de la app -->
  <div id="aviso-version" class="aviso-version" hidden>
    <span>Hay una versión nueva</span>
    <button id="btn-recargar" type="button" class="boton boton-pequeno">Recargar</button>
  </div>

  <main class="contenedor">
    <header class="cabecera">
      <h1>♠&#xFE0E; Póker Estudio</h1>
      <!-- Solo se muestra cuando no hay internet -->
      <span id="estado-red" class="estado-red" hidden>✈️ sin conexión</span>
    </header>

    <!-- ===== 1. RESULTADO (arriba: solo se mira) ===== -->
    <section class="tarjeta resultado" id="resultado" aria-live="polite">
      <p id="resultado-vacio" class="texto-suave">Elige tus dos cartas para ver tu equidad.</p>
      <div id="resultado-datos" hidden>
        <p class="equidad"><span id="equidad">–</span> <small id="margen"></small></p>
        <p class="texto-suave">Ganar <strong id="ganar">–</strong> · Empatar <strong id="empatar">–</strong></p>
        <div class="barra"><div id="barra-progreso" class="barra-relleno"></div></div>
        <p class="texto-suave texto-pequeno" id="manos-simuladas"></p>
      </div>
    </section>

    <!-- ===== 2. CARTAS ===== -->
    <section class="tarjeta">
      <h2>Tu mano</h2>
      <div class="huecos" id="huecos-mano"></div>

      <h2>Mesa</h2>
      <div class="huecos" id="huecos-mesa"></div>
      <div class="huecos etiquetas">
        <span class="etiqueta-flop">Flop</span>
        <span>Turn</span>
        <span>River</span>
      </div>
    </section>

    <!-- ===== 3. CONTROLES (abajo: al alcance del pulgar) ===== -->
    <section class="tarjeta controles">
      <div class="fila">
        <span>Jugadores</span>
        <div class="contador">
          <button id="btn-menos" type="button" class="boton boton-redondo" aria-label="Menos jugadores">−</button>
          <strong id="num-jugadores">2</strong>
          <button id="btn-mas" type="button" class="boton boton-redondo" aria-label="Más jugadores">+</button>
        </div>
      </div>

      <div class="fila campos">
        <label>Bote
          <input id="bote" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
        </label>
        <label>A pagar
          <input id="pagar" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
        </label>
      </div>
      <p id="pot-odds" class="pot-odds" hidden></p>
    </section>

    <button id="btn-nueva-mano" type="button" class="boton boton-ancho">Nueva mano</button>

    <p class="version">Versión 0.1.3</p>
  </main>

  <!-- ===== HOJA INFERIOR PARA ELEGIR CARTAS =====
       Está fuera de <main> para poder fijarla abajo de la pantalla.
       Los botones de valores y palos los crea selector.js. -->
  <div id="hoja" class="hoja" aria-hidden="true">
    <div class="hoja-cabecera">
      <span id="hoja-titulo" class="hoja-titulo"></span>
      <button id="btn-quitar" type="button" class="boton boton-pequeno">Quitar</button>
      <button id="btn-listo" type="button" class="boton boton-pequeno boton-acento">Listo</button>
    </div>
    <div id="rejilla-valores" class="rejilla-valores"></div>
    <div id="fila-palos" class="fila-palos"></div>
  </div>

  <!-- type="module": permite usar import/export entre archivos .js -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
